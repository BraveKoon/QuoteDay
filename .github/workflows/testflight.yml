name: TestFlight

# App Store Connect 으로 빌드를 올린다(TestFlight).
#
# 시작하는 방법 두 가지
#   1. 수동 — Actions 탭에서 이 워크플로를 고르고 "Run workflow"
#   2. 자동 — Release 워크플로가 끝나면(새 태그가 만들어지면) 이어서 실행
#
# **태그 push 로는 시작하지 않는다.** Release 워크플로는 GITHUB_TOKEN 으로
# 태그를 만드는데, 그 토큰으로 만든 이벤트는 다른 워크플로를 깨우지 않는다
# (깃허브가 재귀 실행을 막는 의도된 동작이다). 그래서 "태그가 생겼다"가 아니라
# "Release 가 성공했다"를 신호로 쓴다.
#
# 필요한 시크릿 — 없으면 업로드를 건너뛰고 경고만 남긴다.
#
#   APP_STORE_CONNECT_KEY_ID    App Store Connect API 키 ID (예: 2X9ABCDEFG)
#   APP_STORE_CONNECT_ISSUER_ID 발급자 ID (UUID)
#   APP_STORE_CONNECT_KEY       AuthKey_XXXX.p8 의 내용. **그대로** 붙여 넣어도 되고
#                               base64 로 넣어도 된다 — tools/prepare_asc_key.py 가
#                               어느 쪽인지 알아서 판별한다.
#   APPLE_TEAM_ID               개발자 팀 ID (10자)
#
# 키는 App Store Connect → 사용자 및 액세스 → 통합 → App Store Connect API 에서
# 만들고, 역할은 **App Manager** 이상이어야 한다(서명 인증서·프로비저닝 프로파일
# 생성과 업로드를 모두 하기 때문이다).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "빌드할 브랜치·태그·SHA"
        required: true
        default: main
        type: string
      build_number:
        description: "빌드 번호 (비우면 UTC 시각 YYYYMMDDHHMM)"
        required: false
        default: ""
        type: string
      upload:
        description: "App Store Connect 에 업로드 (끄면 아카이브까지만)"
        required: true
        default: true
        type: boolean
  # Actions 탭에서 누를 수 없는 곳(에이전트·스크립트)에서도 돌릴 수 있게 한다.
  #   gh api -X POST repos/<owner>/<repo>/dispatches \
  #     -f event_type=testflight -F client_payload[build_number]=202611011500
  repository_dispatch:
    types: [testflight]
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

# 업로드는 한 번에 하나만. 두 빌드가 동시에 올라가면 빌드 번호가 겹친다.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # ── 1. 정적 검증 ─────────────────────────────────────────────────────────
  # 서명하는 빌드를 만들기 전에, 번역과 프로젝트 구조가 멀쩡한지 먼저 본다.
  # 여기서 걸리면 비싼 macOS 러너를 켤 이유가 없다.
  verify:
    name: 정적 검증
    # 수동(workflow_dispatch) · 스크립트(repository_dispatch) 는 사용자가 시작한 것이다.
    # 자동(workflow_run)은 Release 가 성공했을 때만.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.event.workflow_run.head_sha || 'main' }}

      - name: 프로젝트 구조
        run: python3 tools/check_project.py

      - name: 번역 사전
        run: python3 tools/check_localization.py

      - name: 번체 사전이 간체와 맞는지
        run: |
          pip install --quiet opencc-python-reimplemented
          python3 tools/localization/build_traditional.py --check

  # ── 2. 준비: 버전·빌드 번호와 시크릿 확인 ────────────────────────────────
  prepare:
    name: 버전과 설정 확인
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      ready: ${{ steps.meta.outputs.ready }}
      upload: ${{ steps.meta.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 이번 커밋에 이 버전의 태그가 붙었는지 확인해야 한다.
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.event.workflow_run.head_sha || 'main' }}

      - name: 버전·빌드 번호 정하기
        id: meta
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 문자열로 받는다. 불리언 false 와 "값 없음" 을 구분해야 하기 때문이다.
          INPUT_BUILD: ${{ github.event.inputs.build_number || github.event.client_payload.build_number }}
          INPUT_UPLOAD: ${{ github.event.inputs.upload || github.event.client_payload.upload }}
          # 수동(workflow_dispatch·repository_dispatch)은 사용자가 "올려 달라"고 한 것이다.
          MANUAL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
        run: |
          # 버전은 project.yml 이 유일한 출처다. (릴리스 태그와 같은 값)
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml \
            | sed -E 's/.*MARKETING_VERSION: *"?([^"]+)"?.*/\1/' \
            | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::project.yml 에서 MARKETING_VERSION 을 읽지 못했습니다."
            exit 1
          fi

          # 빌드 번호는 **올릴 때마다 커져야 한다.** 같은 버전에 같은 빌드 번호를
          # 다시 올리면 App Store Connect 가 거부한다. 실행 번호는 워크플로마다
          # 다시 1부터 시작하므로, 기본값은 UTC 시각으로 둔다.
          BUILD="${INPUT_BUILD:-$(date -u +%Y%m%d%H%M)}"
          if ! [[ "$BUILD" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::빌드 번호는 숫자(점으로 구분해 최대 3개)여야 합니다: $BUILD"
            exit 1
          fi

          UPLOAD="true"
          if [ "${INPUT_UPLOAD}" = "false" ]; then UPLOAD="false"; fi

          # Release 워크플로는 버전을 올리지 않은 머지에서도 돈다(할 일이 없어
          # 조용히 끝난다). 그때까지 매번 올리면 같은 버전으로 빌드만 쌓인다.
          # 그래서 automatic 실행은 **이번 커밋에 v<버전> 태그가 붙었을 때만**
          # 올린다. 태그가 없거나 예전 커밋을 가리키면 새 릴리스가 아니다.
          if [ "$MANUAL" != "true" ]; then
            git fetch --tags --force --quiet
            TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$HEAD_SHA" ]; then
              echo "이번 커밋에 v$VERSION 태그가 없습니다. 새 릴리스가 아니므로 건너뜁니다."
              {
                echo "version=$VERSION"
                echo "build="
                echo "ready=false"
                echo "upload=false"
              } >> "$GITHUB_OUTPUT"
              {
                echo "### TestFlight — 건너뜀"
                echo ""
                echo "이번 커밋에 \`v$VERSION\` 태그가 없습니다. 새 릴리스일 때만 자동으로 올립니다."
                echo "지금 올리려면 Actions → TestFlight → Run workflow 를 쓰세요."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # 시크릿이 다 있는지 본다. 값 자체는 절대 출력하지 않는다.
          MISSING=""
          [ -n "$KEY_ID" ]    || MISSING="$MISSING APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ]       || MISSING="$MISSING APP_STORE_CONNECT_KEY"
          [ -n "$TEAM_ID" ]   || MISSING="$MISSING APPLE_TEAM_ID"

          READY="true"
          if [ -n "$MISSING" ]; then
            READY="false"
            echo "::warning::시크릿이 없어 TestFlight 업로드를 건너뜁니다:$MISSING"
            echo "::warning::저장소 Settings → Secrets and variables → Actions 에서 추가하세요. README 의 'TestFlight 로 올리기' 를 보세요."
            # 수동 실행은 사용자가 "올려 달라"고 명시한 것이므로 그냥 실패시킨다.
            if [ "$MANUAL" = "true" ]; then
              echo "::error::수동 실행인데 시크릿이 없습니다:$MISSING"
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "ready=$READY"
            echo "upload=$UPLOAD"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### TestFlight 준비"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 버전 | $VERSION |"
            echo "| 빌드 | $BUILD |"
            echo "| 업로드 | $UPLOAD |"
            echo "| 시크릿 | $([ -z "$MISSING" ] && echo '모두 있음' || echo "없음:$MISSING") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. 아카이브와 업로드 ────────────────────────────────────────────────
  upload:
    name: 아카이브와 업로드
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    # **macos-26** 이어야 한다. App Store Connect 는 iOS 26 SDK(Xcode 26) 이상으로
    # 빌드한 앱만 받는다 — iOS 18.5 SDK 로 만든 .ipa 는 업로드 검증에서
    # "SDK version issue ... must be built with the iOS 26 SDK or later" 로 거부된다.
    runs-on: macos-26
    # 실패 로그를 커밋 코멘트로 남기려면 쓰기 권한이 필요하다.
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.event.workflow_run.head_sha || 'main' }}

      - name: 툴체인 확인
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          # 애플이 요구하는 최소 SDK. 여기서 걸러야 2분짜리 아카이브를 마친 뒤
          # 업로드 검증에서 거부당하는 일이 없다.
          MAJOR=${SDK%%.*}
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::error::iOS SDK $SDK — App Store Connect requires the iOS 26 SDK or later (Xcode 26)."
            echo "### ❌ Xcode 가 너무 낮습니다 (iOS SDK $SDK)" >> "$GITHUB_STEP_SUMMARY"
            echo "러너 이미지를 macos-26 으로 올리거나 Xcode 26 이상을 골라야 합니다." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: 서명 키 준비
        # 시크릿에는 .p8 을 **그대로** 붙여 넣어도 되고 base64 로 넣어도 된다.
        # (깃허브 시크릿은 여러 줄 값을 받는다.) 둘을 구분하는 일은 이 스크립트가
        # 하고, 키가 실제로 풀리는지 openssl 로 한 번 확인한다.
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          RAW_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 tools/prepare_asc_key.py

          # 시크릿에는 끝에 줄바꿈이 붙어 오는 일이 흔하다. 그대로 파일 이름에 쓰면
          # `AuthKey_XXXX\n.p8` 이 되어 altool 이 키를 찾지 못한다.
          KEY_ID=$(printf '%s' "$RAW_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$RAW_ISSUER_ID" | tr -d '[:space:]')
          echo "키 ID ${#KEY_ID}자 / 발급자 ID ${#ISSUER_ID}자"
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp AuthKey.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          echo "altool 이 찾는 자리:"
          ls -l "$HOME/.appstoreconnect/private_keys/"

      - name: API 키 점검
        # 아카이브(2분~) 전에 키가 실제로 통하는지 REST API 로 먼저 확인한다.
        # altool 의 옛 업로드 서비스가 이 키를 거부하더라도, REST 는 통과해야
        # 정상이다. 여기서 걸리면 시크릿을 손봐야 하므로 바로 멈춘다.
        run: |
          if python3 tools/asc_upload.py --check \
               --key "$PWD/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
               --bundle-id com.quoteday.QuoteDay 2>&1 | tee "$RUNNER_TEMP/keycheck.log"; then
            echo "App Store Connect API 키 점검 통과" >> "$GITHUB_STEP_SUMMARY"
          else
            tail -4 "$RUNNER_TEMP/keycheck.log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            {
              echo "### ❌ App Store Connect API 키가 거부되었습니다"
              echo ""
              echo "\`APP_STORE_CONNECT_KEY_ID\` / \`APP_STORE_CONNECT_ISSUER_ID\` 를"
              echo "**App Store Connect → 사용자 및 액세스 → 통합 → App Store Connect API**"
              echo "에서 다시 복사해 주세요. **개인 키(Individual Key)는 쓸 수 없고 팀 키여야** 합니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 아카이브
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          # QD_CLOUDKIT_CONTAINER 는 건드리지 않는다. TestFlight 빌드는 실제로
          # 서명되므로 엔타이틀먼트가 붙고, CloudKit 컨테이너도 그대로 쓸 수 있다.
          xcodebuild archive \
            -project QuoteDay.xcodeproj \
            -scheme QuoteDay \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/QuoteDay.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            MARKETING_VERSION="$VERSION" \
            | xcbeautify

      - name: 아카이브 확인
        # 업로드 전에 한 번 더 본다. 서명이 비어 있으면 여기서 멈추는 편이,
        # App Store Connect 가 거부하는 이유를 나중에 뒤지는 것보다 낫다.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          APP=build/QuoteDay.xcarchive/Products/Applications/QuoteDay.app
          test -d "$APP" || { echo "::error::아카이브에 앱이 없습니다."; exit 1; }
          echo "빌드 번호: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          echo "버전: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          codesign -d --entitlements :- "$APP" 2>/dev/null | head -30 || true
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          if [ "$ACTUAL" != "$BUILD" ]; then
            echo "::error::빌드 번호가 $BUILD 가 아니라 $ACTUAL 입니다."
            exit 1
          fi

      - name: 내보내기 설정 만들기
        # `method` 이름이 Xcode 판마다 다르다. 15.3 부터는 app-store-connect,
        # 그 전에는 app-store 다. 박아 두면 러너 이미지가 바뀌 때 조용히 깨진다.
        #
        # `destination` 은 **넣지 않는다.** 넣으면 xcodebuild 가 직접 업로드하는데,
        # 그 경로는 Xcode 에 로그인된 App Store Connect 계정을 요구해서
        # "No Accounts with App Store Connect Access" 로 실패한다. 업로드는
        # 아래 altool 단계가 API 키로 맡는다.
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os, plistlib, re, subprocess, pathlib

          output = subprocess.run(
              ["xcodebuild", "-version"], capture_output=True, text=True
          ).stdout
          match = re.search(r"Xcode (\d+)\.(\d+)", output)
          major, minor = (int(match.group(1)), int(match.group(2))) if match else (15, 0)
          method = "app-store-connect" if (major, minor) >= (15, 3) else "app-store"
          print(f"Xcode {major}.{minor} → method={method}")

          options = {
              "method": method,
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "automatic",
              "uploadSymbols": True,
              # 빌드 번호는 워크플로가 정한 값을 그대로 쓴다.
              # Xcode 가 다시 매기면 다음 업로드와 번호가 겹칠 수 있다.
              "manageAppVersionAndBuildNumber": False,
          }

          path = pathlib.Path("ExportOptions.plist")
          path.write_bytes(plistlib.dumps(options))
          print(path.read_text())
          PY

      - name: 내보내기 (.ipa)
        # 여기서는 **올리지 않는다.** `destination=upload` 는 Xcode 에 로그인된
        # App Store Connect 계정을 요구해서, 러너에서는
        # "No Accounts with App Store Connect Access" 로 실패한다.
        # 업로드는 다음 단계(altool)가 API 키로 맡는다.
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/export.log"

          if xcodebuild -exportArchive \
               -archivePath build/QuoteDay.xcarchive \
               -exportPath build/export \
               -exportOptionsPlist ExportOptions.plist \
               -allowProvisioningUpdates \
               -authenticationKeyPath "$PWD/AuthKey.p8" \
               -authenticationKeyID "$KEY_ID" \
               -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$LOG" | xcbeautify; then
            ls -lh build/export
            exit 0
          fi

          REASONS=$(grep -E "error:|\\*\\* EXPORT FAILED \\*\\*" "$LOG" \
            | sed -E 's/^[[:space:]]+//' | sort -u | head -5)
          if [ -z "$REASONS" ]; then
            REASONS=$(tail -20 "$LOG" | sed -E 's/^[[:space:]]+//' | grep -v '^$' | head -5)
          fi
          echo "::error title=내보내기 실패::$(echo "$REASONS" | head -1)"
          {
            echo "### ❌ 내보내기 실패"
            echo ""
            echo '```'
            echo "$REASONS"
            echo '```'
            echo ""
            if grep -qi "provisioning\|certificate" "$LOG"; then
              echo "서명 자료를 만들지 못했습니다. Apple Developer 계정의 App ID·capability"
              echo "(App Group·iCloud·Sign in with Apple)를 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 업로드 (App Store Connect API)
        # altool·xcodebuild 의 업로드 경로는 애플의 옛 contentdelivery 서비스로
        # 먼저 인사를 하는데, 이 서비스가 팀 API 키를
        # `Cannot verify client's JWT headers (3004)` 로 거부한다.
        # 같은 키로 REST API 는 잘 통하므로 업로드는 Build Upload API 로 한다.
        # (tools/asc_upload.py) altool 은 예비 경로로만 남긴다.
        if: needs.prepare.outputs.upload == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/upload.log"
          : > "$LOG"

          IPA=$(ls build/export/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::no .ipa was exported"
            exit 1
          fi
          echo "올릴 파일: $IPA ($(du -h "$IPA" | cut -f1))" | tee -a "$LOG"

          UPLOADED=false
          # REST 로그를 따로 남긴다. altool 이 쏟는 줄에 묻히면 원인을 못 본다.
          REST_LOG="$RUNNER_TEMP/rest.log"
          echo "── 경로 1: App Store Connect Build Upload API ──" | tee -a "$LOG" "$REST_LOG"
          if python3 tools/asc_upload.py --upload "$IPA" \
               --key "$PWD/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
               --version "$VERSION" --build "$BUILD" 2>&1 | tee -a "$LOG" "$REST_LOG"; then
            UPLOADED=true
          fi

          if [ "$UPLOADED" != "true" ]; then
            echo "── 경로 2: altool (예비) ──" | tee -a "$LOG"
            if xcrun --find altool >/dev/null 2>&1 \
               && xcrun altool --upload-app --type ios --file "$IPA" \
                    --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --verbose 2>&1 | tee -a "$LOG"; then
              UPLOADED=true
            else
              echo "altool 로도 올리지 못했습니다." | tee -a "$LOG"
            fi
          fi

          if [ "$UPLOADED" = "true" ]; then
            echo "UPLOAD OK" | tee -a "$LOG"
            {
              echo "### ✅ TestFlight 업로드 완료"
              echo ""
              echo "App Store Connect 처리에 보통 5~15분 걸립니다. 그동안 TestFlight 목록에"
              echo "빌드가 보이지 않는 것은 정상입니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ── 실패: 이유를 세 곳에 남긴다 ─────────────────────────────────
          REASONS=$(grep -E "^ERROR|ITMS-[0-9]+|error:|Unable to|not valid|거부|실패" "$LOG" \
            | sed -E 's/^[[:space:]]+//' | sort -u | head -5)
          if [ -z "$REASONS" ]; then
            REASONS=$(tail -25 "$LOG" | sed -E 's/^[[:space:]]+//' | grep -v '^$' | head -8)
          fi

          # ① 애너테이션 — title= 속성과 한글을 쓰지 않는다. 워크플로 명령이
          #    조용히 무시되는 경우가 있어, 원문 줄만 그대로 싣는다.
          echo "$REASONS" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

          # ② 단계 요약 + ③ 커밋 코멘트 (러너가 사라져도 남는 통로)
          {
            echo "### ❌ TestFlight 업로드 실패"
            echo ""
            echo '```'
            echo "$REASONS"
            echo '```'
            echo ""
            if grep -qi "3004\|JWT" "$LOG"; then
              echo "API 키가 업로드 서비스에서 거부되었습니다(3004). **팀 키**의 키 ID·발급자 ID 를 App Store Connect → 사용자 및 액세스 → 통합 → App Store Connect API 에서 다시 복사해 주세요."
            elif grep -qi "No suitable application records\|does not exist" "$LOG"; then
              echo "App Store Connect 에 앱 레코드가 없습니다. **내 앱 → 새 앱** 에서 번들 ID \`com.quoteday.QuoteDay\` 로 먼저 만들어 주세요."
            elif grep -qi "already been used\|Redundant Binary\|already exists" "$LOG"; then
              echo "같은 빌드 번호가 이미 올라가 있습니다. \`build_number\` 를 올려 다시 실행하세요."
            elif grep -qi "401\|403\|Unauthorized\|FORBIDDEN" "$LOG"; then
              echo "API 키 인증/권한 문제입니다. 키 역할(App Manager 이상)과 팀 ID 를 확인하세요."
            fi
            echo ""
            echo "지금 내려받을 수 있는 \`.ipa\` 아티팩트를 Transporter 로 직접 올려도 됩니다."
          } | tee "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "### TestFlight 업로드 실패"
            echo ""
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo '```'
            if [ -s "$REST_LOG" ]; then
              echo ""
              echo "**경로 1 (Build Upload API)**"
              echo ""
              echo '```'
              tail -12 "$REST_LOG" | sed -E 's/[[:cntrl:]]//g'
              echo '```'
            fi
            echo ""
            echo "**경로 2 (altool)**"
            echo ""
            echo '```'
            tail -60 "$LOG" | sed -E 's/[[:cntrl:]]//g'
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat "$RUNNER_TEMP/comment.md")" \
            || echo "커밋 코멘트를 남기지 못했습니다(권한)."

          exit 1

      - name: 아티팩트로 남기기
        # 실패한 실행에서도 .ipa 를 챙길 수 있어야 한다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuoteDay-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build }}
          path: |
            build/export/*.ipa
            ${{ runner.temp }}/upload.log
            ${{ runner.temp }}/rest.log
            build/QuoteDay.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 14

      - name: 정리
        # .p8 은 러너와 함께 사라지지만, 아티팩트에 섞이지 않도록 지운다.
        # altool 이 쓰는 홈 디렉터리 사본도 함께 지운다.
        if: always()
        run: |
          rm -f AuthKey.p8
          rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: 결과 요약
        if: always()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          UPLOADED: ${{ needs.prepare.outputs.upload }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### $([ "$OUTCOME" = "success" ] && echo '✅' || echo '❌') TestFlight"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 버전 | $VERSION |"
            echo "| 빌드 | $BUILD |"
            echo "| 업로드 | $UPLOADED |"
            echo ""
            if [ "$UPLOADED" = "true" ] && [ "$OUTCOME" = "success" ]; then
              echo "App Store Connect → TestFlight 에서 처리(보통 5~15분)를 기다린 뒤 테스터에게 배포됩니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
